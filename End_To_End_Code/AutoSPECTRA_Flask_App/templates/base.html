<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}AutoSPECTRA{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
<header class="topbar">
    <a class="brand" href="{{ url_for('index') }}">
        <span class="brand-mark">AS</span>
        <span><strong>AutoSPECTRA</strong><small>CAN Bus Intrusion Detection</small></span>
    </a>
    <nav>
        <a href="{{ url_for('index') }}">Analyse</a>
        <a href="{{ url_for('about') }}">About</a>
        <a href="{{ url_for('health') }}">System status</a>
    </nav>
</header>
<main class="page-shell">
    {% block content %}{% endblock %}
</main>
<footer>
    Decision-support research prototype. Do not connect predictions directly to vehicle-control actions.
</footer>
<script src="{{ url_for('static', filename='js/app.js') }}"></script>
</body>
</html>
