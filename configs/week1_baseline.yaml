project: AutoSPECTRA
random_seed: 42
classes:
  - Normal
  - DoS
  - Fuzzy
  - Gear
  - RPM
window:
  size_frames: 64
  stride_frames: 64
split:
  strategy: source_aware_chronological
  train_ratio: 0.70
  validation_ratio: 0.15
  test_ratio: 0.15
evaluation:
  primary_metric: macro_f1
  required_metrics:
    - accuracy
    - balanced_accuracy
    - per_class_precision
    - per_class_recall
    - per_class_f1
    - macro_f1
    - confusion_matrix
    - false_positive_rate
    - detection_latency
responsible_ai:
  automated_vehicle_control: false
  human_oversight_required: true
